[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-intel"
version = "0.1.0"
description = "Live search-demand vs content-supply intelligence from Google Trends and YouTube"
requires-python = ">=3.11"

dependencies = [
    "pytrends-modern==0.2.12",
    "google-api-python-client==2.198.0",
    "pandas==3.0.5",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
